<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgJs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="jsBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgJs)" />
  <circle cx="120" cy="90" r="140" fill="#facc15" opacity="0.05" />
  
  <!-- Code Editor Window -->
  <rect x="70" y="45" width="460" height="265" rx="14" fill="#0f172a" stroke="rgba(250,204,21,0.25)" stroke-width="2" />
  <!-- Window Header -->
  <rect x="70" y="45" width="460" height="40" rx="14" fill="#1e293b" />
  <rect x="70" y="70" width="460" height="15" fill="#1e293b" />
  <circle cx="95" cy="65" r="5.5" fill="#ef4444" />
  <circle cx="115" cy="65" r="5.5" fill="#f59e0b" />
  <circle cx="135" cy="65" r="5.5" fill="#10b981" />
  <text x="300" y="70" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">app.js — Vanilla JavaScript ES6+</text>

  <!-- JS Logo Badge -->
  <rect x="420" y="110" width="75" height="75" rx="12" fill="url(#jsBadge)" />
  <text x="465" y="170" fill="#000000" font-family="sans-serif" font-weight="900" font-size="44" text-anchor="middle">JS</text>

  <!-- Syntax Code Lines -->
  <g font-family="monospace" font-size="14" transform="translate(100, 120)">
    <text y="20"><tspan fill="#f43f5e">const</tspan> <tspan fill="#38bdf8">fetchData</tspan> = <tspan fill="#f43f5e">async</tspan> () =&gt; {</text>
    <text y="50" dx="20"><tspan fill="#f43f5e">try</tspan> {</text>
    <text y="80" dx="40"><tspan fill="#f43f5e">const</tspan> res = <tspan fill="#f43f5e">await</tspan> api.get();</text>
    <text y="110" dx="40"><tspan fill="#38bdf8">renderUI</tspan>(res.data);</text>
    <text y="140" dx="20">} <tspan fill="#f43f5e">catch</tspan> (err) { ... }</text>
    <text y="170">};</text>
  </g>
</svg>
