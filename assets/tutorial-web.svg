<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg1)" />
  <circle cx="500" cy="80" r="120" fill="#38bdf8" opacity="0.08" />
  <circle cx="100" cy="280" r="100" fill="#818cf8" opacity="0.08" />
  
  <!-- Browser Window Mockup -->
  <rect x="80" y="45" width="440" height="260" rx="14" fill="#131d31" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  <!-- Window Header -->
  <rect x="80" y="45" width="440" height="42" rx="14" fill="#1a2438" />
  <rect x="80" y="70" width="440" height="17" fill="#1a2438" />
  <!-- Window Controls -->
  <circle cx="108" cy="66" r="6" fill="#ef4444" />
  <circle cx="128" cy="66" r="6" fill="#f59e0b" />
  <circle cx="148" cy="66" r="6" fill="#10b981" />
  <!-- Address bar -->
  <rect x="180" y="56" width="240" height="20" rx="6" fill="#0f172a" />
  <text x="300" y="70" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">tutorial-html-css-grid.dev</text>

  <!-- Code / Layout Inside Window -->
  <g transform="translate(110, 110)">
    <!-- Simulated Grid Blocks -->
    <rect x="0" y="0" width="120" height="150" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" />
    <rect x="140" y="0" width="240" height="70" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    <rect x="140" y="85" width="240" height="65" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    
    <text x="60" y="80" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">Sidebar</text>
    <text x="260" y="40" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">CSS Grid &amp; Flexbox</text>
    <text x="260" y="125" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">تصميم متجاوب حديث</text>
  </g>
</svg>
