<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="500" />
    <line x1="150" y1="0" x2="150" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="350" y1="0" x2="350" y2="500" />
    <line x1="450" y1="0" x2="450" y2="500" />
    <line x1="0" y1="100" x2="500" y2="100" />
    <line x1="0" y1="200" x2="500" y2="200" />
    <line x1="0" y1="300" x2="500" y2="300" />
    <line x1="0" y1="400" x2="500" y2="400" />
  </g>

  <!-- Glowing Aura -->
  <circle cx="250" cy="220" r="140" fill="#0284c7" opacity="0.25" filter="url(#glow)" />
  
  <!-- Outer Ring -->
  <circle cx="250" cy="220" r="130" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="10 15" opacity="0.6" />

  <!-- Avatar Circle Base -->
  <circle cx="250" cy="220" r="115" fill="url(#avatarGrad)" stroke="#38bdf8" stroke-width="3" />

  <!-- Stylized Programmer Silhouette -->
  <!-- Shoulders / Torso -->
  <path d="M 160 325 C 160 270 200 260 250 260 C 300 260 340 270 340 325 Z" fill="#475569" />
  <!-- Shirt collar accent -->
  <path d="M 230 260 L 250 285 L 270 260 Z" fill="#38bdf8" opacity="0.8" />
  
  <!-- Head -->
  <circle cx="250" cy="205" r="45" fill="#e2e8f0" />
  <!-- Hair / Glasses Tech Style -->
  <path d="M 210 195 C 210 160 240 155 250 155 C 260 155 290 160 290 195 C 275 185 225 185 210 195 Z" fill="#1e293b" />
  <!-- Glasses -->
  <rect x="220" y="195" width="25" height="15" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <rect x="255" y="195" width="25" height="15" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <line x1="245" y1="202" x2="255" y2="202" stroke="#38bdf8" stroke-width="2" />
  <!-- Smile -->
  <path d="M 238 230 Q 250 238 262 230" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Code Badges floating -->
  <g transform="translate(70, 110)">
    <rect width="80" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="40" y="22" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">&lt;/&gt; Code</text>
  </g>

  <g transform="translate(350, 110)">
    <rect width="80" height="34" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="40" y="22" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">JS / Web</text>
  </g>

  <g transform="translate(60, 310)">
    <rect width="90" height="34" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="45" y="22" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Mentor</text>
  </g>

  <!-- Replaceable Photo Note Badge at Bottom -->
  <g transform="translate(65, 410)">
    <rect width="370" height="55" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <circle cx="35" cy="28" r="14" fill="#0284c7" />
    <path d="M 30 28 L 34 32 L 41 24" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="210" y="26" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">صورة أحمد شنكل التعبيرية</text>
    <text x="210" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">(يمكن استبدال الملف بملف ahmed.jpg بسهولة)</text>
  </g>
</svg>
