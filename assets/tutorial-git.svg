<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="gitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgGit)" />
  <circle cx="480" cy="180" r="130" fill="#f97316" opacity="0.06" />

  <!-- Git Branching Diagram -->
  <g transform="translate(100, 60)">
    <!-- Terminal card -->
    <rect width="400" height="240" rx="14" fill="#131d31" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
    
    <!-- Title -->
    <text x="30" y="45" fill="#f97316" font-family="monospace" font-size="16" font-weight="bold">$ git checkout -b feature/main</text>
    
    <!-- Main Branch Line -->
    <line x1="60" y1="120" x2="340" y2="120" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <circle cx="80" cy="120" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
    <circle cx="180" cy="120" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
    <circle cx="320" cy="120" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />

    <!-- Feature Branch Arc -->
    <path d="M 80 120 C 130 190 230 190 320 120" fill="none" stroke="#f97316" stroke-width="3.5" stroke-dasharray="6 6" />
    <circle cx="200" cy="172" r="12" fill="#0f172a" stroke="#f97316" stroke-width="4" />

    <text x="80" y="95" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">v1.0</text>
    <text x="180" y="95" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Commit</text>
    <text x="320" y="95" fill="#38bdf8" font-family="sans-serif" font-size="12" text-anchor="middle">Merge PR</text>
    <text x="200" y="210" fill="#f97316" font-family="sans-serif" font-size="12" text-anchor="middle">Feature Branch</text>
  </g>
</svg>
