<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgApi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgApi)" />
  <circle cx="300" cy="180" r="140" fill="#10b981" opacity="0.06" />

  <!-- REST API Visual -->
  <g transform="translate(70, 70)">
    <!-- Client Box -->
    <rect x="0" y="50" width="130" height="120" rx="12" fill="#131d31" stroke="#38bdf8" stroke-width="2" />
    <text x="65" y="100" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">العميل</text>
    <text x="65" y="125" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="middle">Client / UI</text>

    <!-- Arrows -->
    <!-- Request -->
    <path d="M 140 85 L 310 85" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <polygon points="310,85 300,80 300,90" fill="#10b981" />
    <text x="225" y="75" fill="#10b981" font-family="monospace" font-size="11" text-anchor="middle">GET /api/data HTTP</text>

    <!-- Response -->
    <path d="M 310 135 L 140 135" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <polygon points="140,135 150,130 150,140" fill="#38bdf8" />
    <text x="225" y="155" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">200 OK (JSON)</text>

    <!-- Server Box -->
    <rect x="320" y="50" width="140" height="120" rx="12" fill="#131d31" stroke="#10b981" stroke-width="2" />
    <text x="390" y="100" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">الخادم</text>
    <text x="390" y="125" fill="#10b981" font-family="monospace" font-size="12" text-anchor="middle">RESTful API</text>
  </g>
</svg>
